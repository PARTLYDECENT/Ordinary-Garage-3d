<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Vehicle Garage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="skybox.js"></script>
    <style>
        /* Custom font and ensuring canvas takes full space */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevents scrollbars */
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none; /* Prevents browser gestures on canvas */
        }
        /* Style for the loading/error overlay */
        #info-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 1rem 2rem;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 0.5rem;
            text-align: center;
            z-index: 10;
            display: none; /* Hidden by default */
        }
        #toolbox {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 0.5rem;
            padding: 1rem;
            z-index: 10;
            display: none; /* Hidden by default */
            max-height: calc(100vh - 10rem); /* Leave space for controls */
            overflow-y: auto;
        }
        /* Responsive toolbox for mobile */
        @media (max-width: 640px) {
            #toolbox {
                width: 90%;
                left: 50%;
                transform: translateX(-50%);
            }
        }
        /* Lore popup animation */
        @keyframes fade-in-right {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-fade-in-right {
            animation: fade-in-right 0.5s ease-out forwards;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">

    <canvas id="renderCanvas"></canvas>

    <div id="lore-popups" class="absolute top-5 right-5 w-64 space-y-2 z-10 pointer-events-none"></div>

    <div id="enter-overlay" class="absolute inset-0 bg-gray-900 flex items-center justify-center z-20">
        <button id="enterBtn" class="px-8 py-4 bg-green-600 hover:bg-green-700 text-white text-2xl font-bold rounded-lg transition-colors duration-300">
            Enter
        </button>
    </div>

    <audio id="bg_music_1" src="tune1.wav" loop preload="auto"></audio>
    <audio id="bg_music_2" src="tune2.wav" loop preload="auto"></audio>
    <audio id="bg_music_3" src="tune3.wav" loop preload="auto"></audio>
    <audio id="bg_music_4" src="tune4.wav" loop preload="auto"></audio>
    <audio id="bg_music_5" src="tune5.wav" loop preload="auto"></audio>
    <audio id="bg_music_6" src="tune6.wav" loop preload="auto"></audio>

    <video id="tvVideoPlayer" style="display: none;" playsinline webkit-playsinline muted></video>

    <div id="toolbox">
        <h3 class="text-lg font-bold mb-2">Vehicle Tools</h3>
        <button id="colorBtn" class="w-full text-left px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors duration-300 mb-2">Change Color</button>
        <button id="wireframeBtn" class="w-full text-left px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors duration-300 mb-2">Toggle Wireframe</button>
        <button id="propRotationBtn" class="w-full text-left px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors duration-300 mb-2">Toggle Prop Rotation</button>
        <button id="autoOrbitBtn" class="w-full text-left px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors duration-300 mb-4">Toggle Auto Orbit</button>
        
        <h3 class="text-lg font-bold mb-2">Scene Tools</h3>
        <button id="resetCameraBtn" class="w-full text-left px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors duration-300 mb-2">Reset Camera</button>
        <button id="toggleGroundBtn" class="w-full text-left px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors duration-300 mb-2">Toggle Ground</button>
        <button id="toggleLightsBtn" class="w-full text-left px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors duration-300 mb-2">Toggle Lights</button>
        <button id="toggleSkyboxBtn" class="w-full text-left px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors duration-300 mb-2">Toggle Skybox</button>
        <button id="toggleFogBtn" class="w-full text-left px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors duration-300 mb-2">Toggle Fog</button>
        <button id="changeGroundBtn" class="w-full text-left px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors duration-300 mb-4">Change Ground</button>
        
        <h3 class="text-lg font-bold mb-2">Media</h3>
        <button id="changeSongBtn" class="w-full text-left px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition-colors duration-300 mb-2">Change Song</button>
        <button id="changeVideoBtn" class="w-full text-left px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition-colors duration-300 mb-4">Change Video</button>

        <h3 class="text-lg font-bold mb-2">Utilities</h3>
        <button id="screenshotBtn" class="w-full text-left px-4 py-2 bg-teal-600 hover:bg-teal-700 rounded-lg transition-colors duration-300">Take Screenshot</button>
    </div>

    <div class="absolute bottom-5 left-1/2 -translate-x-1/2 w-11/12 max-w-lg sm:w-auto flex flex-col sm:flex-row items-center gap-2 bg-gray-800 bg-opacity-80 p-3 rounded-xl shadow-lg">
        <div class="flex items-center justify-between w-full sm:w-auto sm:gap-4">
            <button id="prevBtn" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors duration-300 disabled:bg-gray-600 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            
            <div class="text-center">
                <h2 id="vehicleName" class="text-xl font-bold whitespace-nowrap px-2">Vehicle 1</h2>
            </div>

            <button id="nextBtn" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors duration-300 disabled:bg-gray-600 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-right"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </div>

        <button id="toggleToolboxBtn" class="w-full sm:w-auto mt-2 sm:mt-0 px-5 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-colors duration-300">
            Toggle Toolbox
        </button>
    </div>

    <div id="info-overlay">
        <p id="info-text"></p>
    </div>

    <script>
        // MAIN APPLICATION CODE
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('renderCanvas');
            const vehicleNameEl = document.getElementById('vehicleName');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const infoOverlay = document.getElementById('info-overlay');
            const infoText = document.getElementById('info-text');
            const enterBtn = document.getElementById('enterBtn');
            const enterOverlay = document.getElementById('enter-overlay');
            const lorePopupContainer = document.getElementById('lore-popups');

            // --- Toolbox elements ---
            const toolbox = document.getElementById('toolbox');
            const colorBtn = document.getElementById('colorBtn');
            const wireframeBtn = document.getElementById('wireframeBtn');
            const resetCameraBtn = document.getElementById('resetCameraBtn');
            const toggleGroundBtn = document.getElementById('toggleGroundBtn');
            const toggleLightsBtn = document.getElementById('toggleLightsBtn');
            const toggleToolboxBtn = document.getElementById('toggleToolboxBtn');
            const autoOrbitBtn = document.getElementById('autoOrbitBtn');
            const propRotationBtn = document.getElementById('propRotationBtn');
            // New toolbox buttons
            const screenshotBtn = document.getElementById('screenshotBtn');
            const toggleFogBtn = document.getElementById('toggleFogBtn');
            const toggleSkyboxBtn = document.getElementById('toggleSkyboxBtn');
            const changeGroundBtn = document.getElementById('changeGroundBtn');
            const changeSongBtn = document.getElementById('changeSongBtn');
            const changeVideoBtn = document.getElementById('changeVideoBtn');

            // --- Music elements ---
            const bgMusic = [
                document.getElementById('bg_music_1'), document.getElementById('bg_music_2'),
                document.getElementById('bg_music_3'), document.getElementById('bg_music_4'),
                document.getElementById('bg_music_5'), document.getElementById('bg_music_6')
            ];
            let activeMusic = null;

            
            const vehicleNames = [
                "", "Odysee", "Mining Ship", "Material Handler", "Advanced Ship", "S2 Concept", "Unknown Vehicle"
            ];
            
            // --- Babylon.js setup ---
            const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
            let scene, camera, ground, light, dirLight, warSky;

            // --- Draco Compression Configuration ---
            BABYLON.DracoCompression.Configuration = {
                decoder: {
                    wasmUrl: "https://cdn.babylonjs.com/draco_wasm_wrapper_babylon.js",
                    wasmBinaryUrl: "https://cdn.babylonjs.com/draco_decoder_gltf.wasm",
                    fallbackUrl: "https://cdn.babylonjs.com/draco_decoder_gltf.js"
                }
            };

            // --- Vehicle configuration ---
            const TOTAL_VEHICLES = 6;
            let currentVehicleIndex = 1;
            let currentVehicleMeshes = null;
            let isVehicleRotating = false;
            
            // --- Scene assets ---
            const groundTextureUrls = ["plane.jpg", "plane2.jpg", "concrete.jpg"]; // Add more texture paths here
            let currentGroundTextureIndex = 0;
            const videoUrls = ["vid1.mp4", "vid2.mp4", "vid4.mp4", "vid5.mp4", "vid6.mp4"];
            let currentVideoIndex = 0;
            let videoTexture;
            let playNextVideo;

            // --- Lore & Popups ---
            const loreData = {
                1: [
                    "The Odysee model by Ordinary Technology was the first to feature their proprietary 'Starlight' short-range FTL drive.",
                    "Early models of the Odysee were prone to unexpected navigation system reboots. OT insists this is fixed in the current version."
                ],
                2: [
                    "Ordinary Technology's 'Goliath' series mining ships are known for their durability, capable of operating in the most hazardous asteroid fields.",
                    "The primary mining laser on this model has enough power to crack a small moon, according to OT's marketing materials."
                ],
                3: [
                    "The 'Hercules' material handler is the backbone of OT's orbital construction platforms. Its powerful tractor beams can move objects a hundred times its own mass.",
                    "Despite its industrial purpose, the 'Hercules' has surprisingly comfortable crew quarters, a rare luxury in OT designs."
                ],
                4: [
                    "Designated 'X-7', this advanced prototype from Ordinary Technology is rumored to have cloaking capabilities, though OT officially denies it.",
                    "The unique energy signature of the 'X-7' has led to it being mistaken for a cosmic anomaly on several occasions."
                ],
                5: [
                    "The 'S2 Concept' was a design study by Ordinary Technology to explore organic-inspired ship geometries. It never went into full production.",
                    "The S2's hull is made from a self-repairing polymer, a technology that OT later perfected for its military contracts."
                ],
                6: [
                    "This vessel's origin is unknown. Salvage teams found it adrift. Some speculate it's a secret military project from Ordinary Technology, but its design is unlike any of their known ships.",
                    "Scans of the 'Unknown Vehicle' show energy patterns that are inconsistent with known human technology. OT has placed a high bounty on its recovery."
                ],
                generic: [
                    "All vehicles from Ordinary Technology are certified for both atmospheric and deep-space flight.",
                    "Ordinary Technology prides itself on creating vessels that are as reliable as they are unremarkable.",
                    "The standard OT-issue cockpit interface has won numerous awards for its 'intuitive, if uninspired' design."
                ]
            };

            const showLorePopup = () => {
                const vehicleLore = loreData[currentVehicleIndex] || [];
                const allLore = [...vehicleLore, ...loreData.generic];
                const loreText = allLore[Math.floor(Math.random() * allLore.length)];

                const popup = document.createElement('div');
                popup.className = 'relative bg-gray-800 bg-opacity-90 p-4 rounded-lg shadow-xl text-white text-sm pointer-events-auto animate-fade-in-right';
                
                const text = document.createElement('p');
                text.textContent = loreText;

                const closeBtn = document.createElement('button');
                closeBtn.innerHTML = '&times;';
                closeBtn.className = 'absolute top-1 right-2 text-gray-400 hover:text-white';
                closeBtn.onclick = () => popup.remove();

                popup.appendChild(text);
                popup.appendChild(closeBtn);
                
                if (lorePopupContainer) lorePopupContainer.appendChild(popup);

                // Automatically remove after some time
                setTimeout(() => {
                    popup.remove();
                }, 15000); // 15 seconds
            };

            // --- Function to create the scene ---
            const createScene = () => {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.15, 1);

                // --- Fog Setup ---
                scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
                scene.fogDensity = 0.01;
                scene.fogColor = new BABYLON.Color3(0.1, 0.1, 0.15);
                scene.fogEnabled = false; // Initially disabled

                camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 15, new BABYLON.Vector3(0, 1, 0), scene);
                camera.attachControl(canvas, true);
                camera.wheelPrecision = 20;
                camera.lowerRadiusLimit = 5;
                camera.upperRadiusLimit = 50;
                camera.panningSensibility = 100;
                camera.panningKeyCode = 16;

                light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
                light.intensity = 0.8;

                dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-0.5, -1, -0.5), scene);
                dirLight.position = new BABYLON.Vector3(20, 40, 20);
                dirLight.intensity = 0.7;

                ground = BABYLON.MeshBuilder.CreateBox("ground", { width: 50, height: 1, depth: 50 }, scene);
                ground.position.y = -0.5;
                const groundMaterial = new BABYLON.StandardMaterial("groundMat", scene);
                groundMaterial.diffuseTexture = new BABYLON.Texture(groundTextureUrls[0], scene);
                groundMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                ground.material = groundMaterial;
                ground.receiveShadows = true;

                const shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
                shadowGenerator.useBlurExponentialShadowMap = true;
                shadowGenerator.blurKernel = 32;
                dirLight.shadowGenerator = shadowGenerator;

                // --- Garage Elements ---
                const garageMaterial = new BABYLON.StandardMaterial("garageMat", scene);
                garageMaterial.diffuseTexture = new BABYLON.Texture("plane2.jpg", scene);
                garageMaterial.backFaceCulling = false;

                const garageWidth = 40, garageDepth = 40, garageHeight = 20;

                const backWall = BABYLON.MeshBuilder.CreateBox("backWall", { width: garageWidth, height: garageHeight, depth: 0.1 }, scene);
                backWall.position = new BABYLON.Vector3(0, garageHeight / 2, garageDepth / 2 - 0.05);
                backWall.material = garageMaterial;
                shadowGenerator.addShadowCaster(backWall);

                const leftWall = BABYLON.MeshBuilder.CreateBox("leftWall", { width: garageDepth, height: garageHeight, depth: 0.1 }, scene);
                leftWall.position = new BABYLON.Vector3(-garageWidth / 2 + 0.05, garageHeight / 2, 0);
                leftWall.rotation.y = Math.PI / 2;
                leftWall.material = garageMaterial;
                shadowGenerator.addShadowCaster(leftWall);

                const rightWall = BABYLON.MeshBuilder.CreateBox("rightWall", { width: garageDepth, height: garageHeight, depth: 0.1 }, scene);
                rightWall.position = new BABYLON.Vector3(garageWidth / 2 - 0.05, garageHeight / 2, 0);
                rightWall.rotation.y = -Math.PI / 2;
                rightWall.material = garageMaterial;
                shadowGenerator.addShadowCaster(rightWall);

                const roof = BABYLON.MeshBuilder.CreateBox("roof", { width: garageWidth, height: 0.1, depth: garageDepth }, scene);
                roof.position = new BABYLON.Vector3(0, garageHeight - 0.05, 0);
                roof.material = garageMaterial;
                shadowGenerator.addShadowCaster(roof);

                // --- Video Screen Playlist Logic ---
                const videoScreen = BABYLON.MeshBuilder.CreatePlane("videoScreen", { width: 16, height: 9 }, scene); // 16:9 aspect ratio
                videoScreen.position = new BABYLON.Vector3(garageWidth / 2 + 0.01, garageHeight * 0.65, 0); // Position on upper right wall
                videoScreen.rotation.y = -Math.PI / 2; // Rotate to face inwards
                videoScreen.rotation.z = Math.PI; // Rotate 180 degrees to make it upside down

                

                const videoMaterial = new BABYLON.StandardMaterial("videoMaterial", scene);
                videoMaterial.emissiveColor = new BABYLON.Color3(1, 1, 1); // Make it glow
                videoScreen.material = videoMaterial;

                playNextVideo = () => {
                    if (videoTexture) {
                        videoTexture.dispose();
                    }
                    const videoUrl = videoUrls[currentVideoIndex];
                    videoTexture = new BABYLON.VideoTexture("video", videoUrl, scene, true, true);
                    videoMaterial.diffuseTexture = videoTexture;

                    videoTexture.video.muted = true;
                    videoTexture.video.play().catch(e => console.error(`Autoplay failed for ${videoUrl}:`, e));

                    videoTexture.video.onended = () => {
                        currentVideoIndex = (currentVideoIndex + 1) % videoUrls.length; // Loop to next video
                        playNextVideo();
                    };
                };
                
                // Start playing the video playlist once the scene is ready
                scene.onReadyObservable.addOnce(() => {
                    playNextVideo();
                });

                return scene;
            };

            const showInfo = (message) => {
                infoText.textContent = message;
                infoOverlay.style.display = 'block';
            };

            const hideInfo = () => {
                infoOverlay.style.display = 'none';
            };
            
            const loadVehicle = (index) => {
                if (currentVehicleMeshes) {
                    currentVehicleMeshes.forEach(mesh => mesh.dispose());
                    currentVehicleMeshes = null;
                }

                showInfo(`Loading Vehicle ${index}...`);
                
                
                const vehiclePath = `assets/vehicle/`;
                const vehicleFilename = `vehicle${index}.glb`;

                BABYLON.SceneLoader.ImportMesh("", vehiclePath, vehicleFilename, scene, 
                    (newMeshes) => {
                        hideInfo();
                        currentVehicleMeshes = newMeshes;
                        
                        const mainVehicleMesh = currentVehicleMeshes[0];
                        if (mainVehicleMesh.animations.length === 0) { // Add bob only if not already animated
                            const startY = mainVehicleMesh.position.y;
                            const bobbingAnimation = new BABYLON.Animation("bobbing", "position.y", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
                            bobbingAnimation.setKeys([
                                { frame: 0, value: startY }, { frame: 30, value: startY + 0.1 },
                                { frame: 60, value: startY }, { frame: 90, value: startY - 0.1 },
                                { frame: 120, value: startY }
                            ]);
                            mainVehicleMesh.animations.push(bobbingAnimation);
                            scene.beginAnimation(mainVehicleMesh, 0, 120, true);
                        }

                        const shadowGenerator = dirLight.getShadowGenerator();
                        if (shadowGenerator) {
                            newMeshes.forEach(mesh => shadowGenerator.addShadowCaster(mesh, true));
                        }
                    },
                    null,
                    (scene, message, exception) => {
                        console.error("Error loading vehicle:", message, exception);
                        showInfo(`Failed to load ${vehicleFilename}.`);
                    }
                );
            };

            // --- Toolbox Functions ---
            const changeVehicleColor = () => {
                if (currentVehicleMeshes) {
                    const randomColor = new BABYLON.Color3(Math.random(), Math.random(), Math.random());
                    currentVehicleMeshes.forEach(mesh => {
                        if (mesh.material && mesh.material.diffuseColor) {
                            mesh.material.diffuseColor = randomColor;
                        }
                    });
                }
            };

            const toggleWireframe = () => {
                if (currentVehicleMeshes) {
                    currentVehicleMeshes.forEach(mesh => {
                        if (mesh.material) mesh.material.wireframe = !mesh.material.wireframe;
                    });
                }
            };

            const resetCamera = () => {
                if (camera) {
                    camera.alpha = -Math.PI / 2;
                    camera.beta = Math.PI / 2.5;
                    camera.radius = 15;
                    camera.target.copyFromFloats(0, 1, 0);
                }
            };

            const toggleGround = () => ground?.setEnabled(!ground.isEnabled());
            const toggleLights = () => {
                if (light && dirLight) {
                    light.setEnabled(!light.isEnabled());
                    dirLight.setEnabled(!dirLight.isEnabled());
                }
            };

            const toggleAutoOrbit = () => {
                if (camera.useAutoRotationBehavior) {
                    camera.useAutoRotationBehavior = false;
                    camera.removeBehavior(camera.autoRotationBehavior);
                } else {
                    const autoRotation = new BABYLON.AutoRotationBehavior();
                    autoRotation.idleRotationSpeed = 0.2;
                    camera.addBehavior(autoRotation);
                    camera.useAutoRotationBehavior = true;
                }
            };

            const togglePropRotation = () => {
                isVehicleRotating = !isVehicleRotating;
            };
            
            // --- NEW Toolbox Functions ---
            const takeScreenshot = () => BABYLON.Tools.CreateScreenshotUsingRenderTarget(engine, camera, { width: 1920, height: 1080 });
            const toggleFog = () => scene.fogEnabled = !scene.fogEnabled;
            const toggleSkybox = () => warSky?.skybox.setEnabled(!warSky.skybox.isEnabled());
            const changeGroundTexture = () => {
                if (ground && ground.material) {
                    currentGroundTextureIndex = (currentGroundTextureIndex + 1) % groundTextureUrls.length;
                    ground.material.diffuseTexture = new BABYLON.Texture(groundTextureUrls[currentGroundTextureIndex], scene);
                }
            };

            const changeSong = () => {
                if (activeMusic) {
                    activeMusic.pause();
                    activeMusic.currentTime = 0;
                }
                const randomIndex = Math.floor(Math.random() * bgMusic.length);
                activeMusic = bgMusic[randomIndex];
                activeMusic.play().catch(e => console.error("Music play failed:", e));
            };

            const changeVideo = () => {
                currentVideoIndex = (currentVideoIndex + 1) % videoUrls.length;
                if (playNextVideo) {
                    playNextVideo();
                }
            };

            const updateUI = () => {
                vehicleNameEl.textContent = vehicleNames[currentVehicleIndex];
                prevBtn.disabled = currentVehicleIndex === 1;
                nextBtn.disabled = currentVehicleIndex === TOTAL_VEHICLES;
            };

            // --- Event Listeners ---
            prevBtn.addEventListener('click', () => {
                if (currentVehicleIndex > 1) {
                    currentVehicleIndex--;
                    updateUI(); loadVehicle(currentVehicleIndex);
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentVehicleIndex < TOTAL_VEHICLES) {
                    currentVehicleIndex++;
                    updateUI(); loadVehicle(currentVehicleIndex);
                }
            });

            // Toolbox button listeners
            colorBtn.addEventListener('click', changeVehicleColor);
            wireframeBtn.addEventListener('click', toggleWireframe);
            resetCameraBtn.addEventListener('click', resetCamera);
            toggleGroundBtn.addEventListener('click', toggleGround);
            toggleLightsBtn.addEventListener('click', toggleLights);
            autoOrbitBtn.addEventListener('click', toggleAutoOrbit);
            propRotationBtn.addEventListener('click', togglePropRotation);
            screenshotBtn.addEventListener('click', takeScreenshot);
            toggleFogBtn.addEventListener('click', toggleFog);
            toggleSkyboxBtn.addEventListener('click', toggleSkybox);
            changeGroundBtn.addEventListener('click', changeGroundTexture);
            changeSongBtn.addEventListener('click', changeSong);
            changeVideoBtn.addEventListener('click', changeVideo);
            
            toggleToolboxBtn.addEventListener('click', () => toolbox.style.display = (toolbox.style.display === 'none' ? 'block' : 'none'));

            const playRandomTune = () => {
                enterOverlay.style.display = 'none';
                changeSong();
                // Start lore popups after entering
                setInterval(() => {
                    if (toolbox.style.display === 'none' && lorePopupContainer.children.length < 3) {
                        if (Math.random() < 0.2) { // 20% chance every 5 seconds
                            showLorePopup();
                        }
                    }
                }, 5000);
            };
            enterBtn.addEventListener('click', playRandomTune);

            // --- Initialize Scene ---
            scene = createScene();
            warSky = createWarPresetSkybox(scene, 'random'); // Store the skybox instance
            updateUI();
            loadVehicle(currentVehicleIndex);

            // --- Render loop ---
            engine.runRenderLoop(() => {
                if (!scene) return;

                if (isVehicleRotating && currentVehicleMeshes && currentVehicleMeshes.length > 0) {
                    if (currentVehicleMeshes[0].rotation) {
                        currentVehicleMeshes[0].rotation.y += 0.005;
                    }
                }

                scene.render();
                
            });

            window.addEventListener('resize', () => engine.resize());
        });
    </script>
</body>
</html>
